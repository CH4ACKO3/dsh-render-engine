name: Publish packages

on:
  push:
    tags:
      - 'dsh-*@*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the tagged commit on main
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.11.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Resolve release package and version
        run: node .github/scripts/verify-release.mjs "$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - name: Install current npm CLI
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify packages
        run: pnpm check

      - name: Refuse already-published package versions
        run: |
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "Refusing to overwrite published package $PACKAGE_NAME@$PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Pack package
        run: pnpm --dir "$PACKAGE_DIR" pack --out "$RUNNER_TEMP/$PACKAGE_SLUG.tgz"

      - name: Publish package
        run: npm publish "$RUNNER_TEMP/$PACKAGE_SLUG.tgz" --access public --tag "$DIST_TAG"
